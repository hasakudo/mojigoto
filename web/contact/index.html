<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#123f52">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://challenges.cloudflare.com; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>お問い合わせ | もじごと</title>
    <link rel="icon" href="../favicon.ico" sizes="any">
    <script src="../theme-init.js?v=1.0.64"></script>
    <link rel="stylesheet" href="../forms.css?v=1.0.2">
    <link rel="stylesheet" href="../theme-palettes.css?v=1.0.0">
  </head>
  <body>
    <header class="form-header"><a class="brand" href="../"><span class="brand-mark" aria-hidden="true">も</span><span>もじごと</span></a></header>
    <main class="form-shell">
      <article class="form-card">
        <p class="eyebrow">CONTACT</p>
        <h1>お問い合わせ</h1>
        <p class="lead">ご質問、不具合のご連絡、登録情報の変更・削除などを受け付けます。</p>
        <form class="public-form" data-public-form="contact">
          <label class="field"><span>名前（ニックネーム可）</span><input name="name" type="text" maxlength="50" autocomplete="name" required></label>
          <label class="field"><span>メールアドレス</span><input name="email" type="email" maxlength="254" autocomplete="email" required></label>
          <label class="field"><span>件名</span><input name="subject" type="text" maxlength="100" required></label>
          <label class="field"><span>メッセージ <small class="optional">10文字以上</small></span><textarea name="message" minlength="10" maxlength="3000" required></textarea></label>
          <label class="honeypot" aria-hidden="true">会社名<input name="company" type="text" tabindex="-1" autocomplete="off"></label>
          <label class="consent"><input name="privacyConsent" type="checkbox" value="yes" required><span><a href="../privacy/" target="_blank" rel="noopener">プライバシーポリシー</a>を確認し、送信内容の取扱いに同意します。</span></label>
          <div id="turnstileArea" class="turnstile-area" aria-label="スパム対策"></div>
          <button id="submitButton" class="submit-button" type="submit" disabled>問い合わせを送信</button>
          <p id="formStatus" class="form-status" role="status" aria-live="polite" hidden></p>
        </form>
      </article>
    </main>
    <footer class="form-footer"><a href="../">もじごとへ戻る</a><a href="../apply/">利用・解除申込</a><a href="../terms/">利用規約</a><a href="../privacy/">プライバシーポリシー</a></footer>
    <script type="module" src="../forms.mjs?v=1.0.3"></script>
  </body>
</html>
